<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактировать сериалы</title>
<style>
:root { 
  --accent: #ffb400; 
  --bg: #121212; 
  --card: #1e1e1e; 
  --cols: 4;
  --font-scale: 1;
}
body { 
  font-family: "Segoe UI", sans-serif; 
  background: var(--bg); 
  color: #fff; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: calc(15px * var(--font-scale)); 
  padding: calc(40px * var(--font-scale)) calc(20px * var(--font-scale)); 
  font-size: calc(1rem * var(--font-scale));
  box-sizing: border-box;
  margin: 0;
  min-height: 100vh;
}
.themeBox { position: fixed; top: 15px; right: 15px; display: flex; gap: 5px; z-index: 100; }
select { background: #1e1e1e; color: white; border: 1px solid var(--accent); padding: calc(5px * var(--font-scale)); border-radius: 4px; font-size: calc(1rem * var(--font-scale)); }
.token-box { background: var(--card); border: 1px dashed var(--accent); padding: calc(15px * var(--font-scale)); border-radius: 10px; width: 100%; max-width: 400px; text-align: center; }
.token-box label { font-size: calc(11px * var(--font-scale)); color: var(--accent); display: block; margin-bottom: 5px; }

.searchBox { position: relative; width: 100%; max-width: 550px; }
#search { 
  padding: calc(10px * var(--font-scale)) calc(115px * var(--font-scale)) calc(10px * var(--font-scale)) calc(10px * var(--font-scale)); 
  width: 100%; 
  border-radius: 8px; 
  border: 1px solid var(--accent); 
  background: #1e1e1e; 
  color: white; 
  outline: none; 
  margin: 0; 
  box-sizing: border-box; 
  font-size: calc(1rem * var(--font-scale)); 
}

.search-btns {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 4px;
  align-items: center;
}

.search-action-btn {
  background: #333;
  border: 1px solid var(--accent);
  color: var(--accent);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: calc(12px * var(--font-scale));
  transition: 0.2s;
}
.search-action-btn:hover {
  background: var(--accent);
  color: #000;
}

#clearSearch { 
  cursor: pointer; 
  color: #aaa; 
  font-size: calc(14px * var(--font-scale)); 
  display: none; 
  transition: 0.2s; 
  padding: 0 4px;
}
#clearSearch:hover { color: #ff4444; }

#linksContainer { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: calc(15px * var(--font-scale)); width: 100%; box-sizing: border-box; }
input { width: 100%; padding: calc(10px * var(--font-scale)); margin-bottom: 8px; border: 2px solid var(--accent); border-radius: 6px; background-color: #1e1e1e; color: #fff; box-sizing: border-box; font-size: calc(1rem * var(--font-scale)); }

.color-row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; background: rgba(0,0,0,0.2); padding: calc(5px * var(--font-scale)); border-radius: 5px; }
.ln-color { width: calc(50px * var(--font-scale)) !important; height: calc(35px * var(--font-scale)); padding: 0 !important; cursor: pointer; border: none !important; background: none !important; margin-bottom: 0 !important; }
.reset-color { font-size: calc(10px * var(--font-scale)); padding: calc(5px * var(--font-scale)); cursor: pointer; background: #333; border: 1px solid #555; color: #ccc; border-radius: 4px; }

.button { background-color: var(--card); border: 2px solid var(--accent); color: var(--accent); padding: calc(12px * var(--font-scale)); border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; text-align: center; font-size: calc(1rem * var(--font-scale)); }
.button:hover { background: var(--accent); color: black; }

.linkBlock { 
  padding: calc(18px * var(--font-scale)); 
  border: 2px solid var(--block-accent, var(--accent)); 
  border-radius: 10px; 
  background: rgba(30,30,30,0.8); 
  transition: border-color 0.2s, transform 0.2s, opacity 0.2s; 
  position: relative;
}
.linkBlock.dragging {
  opacity: 0.4;
  transform: scale(0.98);
}
.linkBlock.drag-over {
  border-style: dashed;
  box-shadow: 0 0 10px var(--accent);
}

.block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  gap: 10px;
}

.drag-handle {
  cursor: grab;
  user-select: none;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--block-accent, var(--accent));
  color: var(--block-accent, var(--accent));
  padding: 4px 10px;
  border-radius: 6px;
  font-size: calc(16px * var(--font-scale));
  display: flex;
  align-items: center;
  gap: 4px;
}
.drag-handle:active {
  cursor: grabbing;
}

.pos-control {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: calc(12px * var(--font-scale));
  color: var(--accent);
  font-weight: bold;
}
.pos-input {
  width: 55px !important;
  margin-bottom: 0 !important;
  padding: 4px 6px !important;
  text-align: center;
}

.controls { display: flex; gap: 5px; margin-top: 5px; }

.danger-btn { border-color: #ef4444; color: #ef4444; }
.danger-btn:hover { background: #ef4444; color: white; }

/* Кнопки зума и индикатор */
.zoomControls {
  position: fixed;
  bottom: 15px;
  right: 15px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 1000;
}
.zoom-btn {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}
.zoom-btn:hover {
  background: var(--accent);
  color: #000;
}

/* Индикатор размера */
.zoom-indicator {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.zoom-indicator.visible {
  opacity: 1;
}

/* Экранная клавиатура (крупные буквы и капслок) */
#virtualKeyboard {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(18, 18, 18, 0.98);
  border-top: 3px solid var(--accent);
  padding: 15px 20px;
  z-index: 2000;
  box-sizing: border-box;
  box-shadow: 0 -5px 25px rgba(0,0,0,0.7);
}
.vk-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.vk-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  width: 100%;
}
.vk-key {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 18px 10px;
  flex: 1;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 22px;
  user-select: none;
  text-transform: uppercase;
}
.vk-key:hover {
  background: var(--accent);
  color: #000;
}
.vk-wide {
  flex: 2;
  font-size: 18px;
}

/* Стили тем */
.glass .button { backdrop-filter: blur(10px); background: rgba(30,30,30,0.6); }
.neon .button { box-shadow: 0 0 calc(10px * var(--font-scale)) var(--accent); }
.soft .button { border-radius: calc(20px * var(--font-scale)); }
.minimal .button { border: none; border-bottom: 2px solid var(--accent); border-radius: 0; }
.bold .button { font-weight: bold; }
</style>
</head>

<body>
<div class="themeBox">
  <select id="colorSelect">
    <option value="#ffb400">🟠</option>
    <option value="#a855f7">🟣</option>
    <option value="#22c55e">🟢</option>
    <option value="#3b82f6">🔵</option>
    <option value="#ef4444">🔴</option>
    <option value="#ec4899">🌸</option>
  </select>
  <select id="styleSelect">
    <option value="">Default</option>
    <option value="glass">Glass</option>
    <option value="neon">Neon</option>
    <option value="soft">Soft</option>
    <option value="minimal">Minimal</option>
    <option value="bold">Bold</option>
  </select>
  <select id="colsSelect">
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>
</div>

<a class="button" href="serials.html" style="min-height: auto;">← На главную</a>
<h1>Редактор</h1>

<div class="token-box">
    <label>GITHUB TOKEN</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxx">
</div>

<div class="searchBox">
  <input type="text" id="search" placeholder="🔍 Поиск по названию...">
  <div class="search-btns">
    <span id="clearSearch">✖</span>
    <button class="search-action-btn" onclick="toggleKeyboard()" title="Экранная клавиатура">⌨</button>
    <button class="search-action-btn" onclick="startVoiceSearch()" title="Голосовой ввод">🎤</button>
  </div>
</div>

<div style="display:flex; gap:8px; flex-wrap:wrap; justify-content: center; margin-top: 5px;">
  <button class="button saveBtn" onclick="saveAll()" style="min-height: auto;">💾 Сохранить везде</button>
  <button class="button" onclick="addNewLink()" style="min-height: auto;">➕ Добавить</button>
  <button class="button danger-btn" onclick="resetAllColors()" style="min-height: auto;">🔴 Сбросить ВСЕ цвета</button>
  <button class="button" onclick="loadFromCloud()" style="min-height: auto;">🔄 Обновить из облака</button>
</div>

<div id="linksContainer"></div>

<!-- Экранная клавиатура -->
<div id="virtualKeyboard">
  <div class="vk-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; color: var(--accent); font-weight: bold; font-size: 16px;">
      <span id="vkTitle">Экранная клавиатура (РУС)</span>
      <span onclick="toggleKeyboard()" style="cursor: pointer; padding: 4px 12px; background: rgba(255,255,255,0.1); border-radius: 6px;">✖ Закрыть</span>
    </div>
    <div class="vk-row" id="vkRow1"></div>
    <div class="vk-row" id="vkRow2"></div>
    <div class="vk-row" id="vkRow3"></div>
    <div class="vk-row">
      <div class="vk-key vk-wide" onclick="toggleLanguage()" id="langBtn" style="background: var(--accent); color: #000;">РУС / ENG</div>
      <div class="vk-key vk-wide" onclick="vkPress(' ')">ПРОБЕЛ</div>
      <div class="vk-key vk-wide" onclick="vkBackspace()">⌫ СТЕРЕТЬ</div>
      <div class="vk-key vk-wide" onclick="vkClear()">ОЧИСТИТЬ</div>
    </div>
  </div>
</div>

<!-- Кнопки изменения размера интерфейса и индикатор -->
<div class="zoomControls">
  <div id="zoomIndicator" class="zoom-indicator">100%</div>
  <button class="zoom-btn" onclick="changeZoom(-0.1)" title="Уменьшить интерфейс">А-</button>
  <button class="zoom-btn" onclick="changeZoom(0.1)" title="Увеличить интерфейс">А+</button>
</div>

<script>
const OWNER = "bucketasmr", REPO = "my-serials-data", FILE_PATH = "my-serials.json";
let links = [];
const ghTokenInput = document.getElementById("gh-token");
ghTokenInput.value = localStorage.getItem("gh_token") || "";

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearSearch');
const vkBoard = document.getElementById('virtualKeyboard');
const zoomIndicator = document.getElementById('zoomIndicator');
let zoomTimeout = null;

let currentLang = 'ru';
let draggedIndex = null;

const layouts = {
  ru: {
    title: 'Экранная клавиатура (РУС)',
    row1: ['й','ц','у','к','е','н','г','ш','щ','з','х','ъ'],
    row2: ['ф','ы','в','а','п','р','о','л','д','ж','э'],
    row3: ['я','ч','с','м','и','т','ь','б','ю']
  },
  en: {
    title: 'Virtual Keyboard (ENG)',
    row1: ['q','w','e','r','t','y','u','i','o','p'],
    row2: ['a','s','d','f','g','h','j','k','l'],
    row3: ['z','x','c','v','b','n','m']
  }
};

function renderKeyboard() {
  document.getElementById('vkTitle').textContent = layouts[currentLang].title;
  
  const r1 = document.getElementById('vkRow1');
  const r2 = document.getElementById('vkRow2');
  const r3 = document.getElementById('vkRow3');
  
  r1.innerHTML = layouts[currentLang].row1.map(char => `<div class="vk-key" onclick="vkPress('${char}')">${char}</div>`).join('');
  r2.innerHTML = layouts[currentLang].row2.map(char => `<div class="vk-key" onclick="vkPress('${char}')">${char}</div>`).join('');
  r3.innerHTML = layouts[currentLang].row3.map(char => `<div class="vk-key" onclick="vkPress('${char}')">${char}</div>`).join('');
}

function toggleLanguage() {
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  renderKeyboard();
}

renderKeyboard();

let fontScale = parseFloat(localStorage.getItem('fontScale')) || 1.4;

function updateZoomIndicator() {
  const percent = Math.round(fontScale * 100) + '%';
  zoomIndicator.textContent = percent;
  zoomIndicator.classList.add('visible');

  if (zoomTimeout) clearTimeout(zoomTimeout);
  zoomTimeout = setTimeout(() => {
    zoomIndicator.classList.remove('visible');
  }, 3000);
}

function applyZoom() {
  if (fontScale < 0.7) fontScale = 0.7;
  if (fontScale > 1.8) fontScale = 1.8;
  document.documentElement.style.setProperty('--font-scale', fontScale);
  localStorage.setItem('fontScale', fontScale);
  updateZoomIndicator();
}

function changeZoom(delta) {
  fontScale += delta;
  applyZoom();
}

applyZoom();
// Скрываем индикатор сразу при загрузке, чтобы он не висел постоянно
zoomIndicator.classList.remove('visible');

function toggleKeyboard() {
  vkBoard.style.display = vkBoard.style.display === 'block' ? 'none' : 'block';
}

function vkPress(char) {
  searchInput.value += char;
  triggerSearch();
}

function vkBackspace() {
  searchInput.value = searchInput.value.slice(0, -1);
  triggerSearch();
}

function vkClear() {
  searchInput.value = "";
  triggerSearch();
}

function triggerSearch() {
  renderInputs(searchInput.value);
  clearBtn.style.display = searchInput.value ? "block" : "none";
}

function startVoiceSearch() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Голосовой ввод не поддерживается вашим браузером.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    searchInput.value = text;
    triggerSearch();
  };
  recognition.onerror = () => {
    alert("Не удалось распознать голос. Попробуйте еще раз.");
  };
  recognition.start();
}

function moveItemToPosition(fromIndex, toIndex) {
  if (isNaN(toIndex) || toIndex < 0 || toIndex >= links.length || fromIndex === toIndex) {
    renderInputs(searchInput.value);
    return;
  }
  const [movedItem] = links.splice(fromIndex, 1);
  links.splice(toIndex, 0, movedItem);
  renderInputs(searchInput.value);
}

function renderInputs(filter = "") {
  const container = document.getElementById("linksContainer");
  container.innerHTML = "";
  
  links.forEach((link, realIndex) => {
    if (filter && !link.name.toLowerCase().includes(filter.toLowerCase())) return;

    const div = document.createElement("div");
    div.className = "linkBlock";
    div.dataset.index = realIndex;
    
    const hasColor = link.color && link.color.startsWith('#');
    const colorVal = hasColor ? link.color : "#ffffff";

    if (hasColor) {
      div.style.setProperty('--block-accent', link.color);
    } else {
      div.style.removeProperty('--block-accent');
    }

    div.innerHTML = `
      <div class="block-header">
        <div class="drag-handle" title="Зажмите и перетащите в нужное место">⣿ Перетащить</div>
        <div class="pos-control">
          <span>№</span>
          <input type="number" min="1" max="${links.length}" value="${realIndex + 1}" class="pos-input" data-index="${realIndex}" title="Измените номер, чтобы переместить на эту позицию">
        </div>
      </div>
      <input value="${link.name || ''}" placeholder="Название" class="ln-name" data-index="${realIndex}">
      <input value="${link.url || ''}" placeholder="Ссылка" class="ln-url" data-index="${realIndex}">
      <div class="color-row">
        <input type="color" value="${colorVal}" class="ln-color" ${hasColor ? 'data-active="true"' : ''} data-index="${realIndex}">
        <button class="reset-color" onclick="resetSingleColor(${realIndex})">Сбросить цвет</button>
        <span style="font-size:calc(11px * var(--font-scale)); color:${hasColor ? 'var(--accent)' : '#777'}">${hasColor ? 'ИНДИВИДУАЛЬНЫЙ' : 'ПО ТЕМЕ'}</span>
      </div>
      <div class="controls">
        <button class="button" onclick="moveUp(${realIndex})" style="min-height: auto;">⬆</button>
        <button class="button" onclick="moveDown(${realIndex})" style="min-height: auto;">⬇</button>
        <button class="button danger-btn" onclick="deleteLink(${realIndex})" style="min-height: auto;">🗑</button>
      </div>`;
    
    const nameInput = div.querySelector('.ln-name');
    const urlInput = div.querySelector('.ln-url');
    const posInput = div.querySelector('.pos-input');
    const cp = div.querySelector('.ln-color');
    const dragHandle = div.querySelector('.drag-handle');

    nameInput.oninput = (e) => { links[realIndex].name = e.target.value; };
    urlInput.oninput = (e) => { links[realIndex].url = e.target.value; };
    
    posInput.onchange = (e) => {
      const newPos = parseInt(e.target.value, 10) - 1;
      moveItemToPosition(realIndex, newPos);
    };

    cp.oninput = () => { 
        cp.setAttribute('data-active', 'true'); 
        links[realIndex].color = cp.value;
        div.style.setProperty('--block-accent', cp.value);
        const status = cp.nextElementSibling.nextElementSibling;
        status.textContent = "ИНДИВИДУАЛЬНЫЙ"; 
        status.style.color = "var(--accent)"; 
    };

    /* Drag and Drop события (Мышь / HTML5) */
    dragHandle.addEventListener('mousedown', () => {
      div.setAttribute('draggable', 'true');
    });

    div.addEventListener('dragstart', (e) => {
      draggedIndex = realIndex;
      div.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', realIndex);
    });

    div.addEventListener('dragend', () => {
      div.classList.remove('dragging');
      div.removeAttribute('draggable');
      document.querySelectorAll('.linkBlock').forEach(b => b.classList.remove('drag-over'));
    });

    div.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      div.classList.add('drag-over');
    });

    div.addEventListener('dragleave', () => {
      div.classList.remove('drag-over');
    });

    div.addEventListener('drop', (e) => {
      e.preventDefault();
      div.classList.remove('drag-over');
      if (draggedIndex !== null && draggedIndex !== realIndex) {
        moveItemToPosition(draggedIndex, realIndex);
        draggedIndex = null;
      }
    });

    /* Поддержка Touch Drag (Сенсорный экран) */
    dragHandle.addEventListener('touchstart', (e) => {
      draggedIndex = realIndex;
      div.classList.add('dragging');
    }, { passive: true });

    dragHandle.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
      if (targetElement) {
        const targetBlock = targetElement.closest('.linkBlock');
        document.querySelectorAll('.linkBlock').forEach(b => b.classList.remove('drag-over'));
        if (targetBlock) {
          targetBlock.classList.add('drag-over');
        }
      }
    }, { passive: true });

    dragHandle.addEventListener('touchend', (e) => {
      const touch = e.changedTouches[0];
      const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
      div.classList.remove('dragging');
      document.querySelectorAll('.linkBlock').forEach(b => b.classList.remove('drag-over'));

      if (targetElement) {
        const targetBlock = targetElement.closest('.linkBlock');
        if (targetBlock && targetBlock.dataset.index !== undefined) {
          const targetIndex = parseInt(targetBlock.dataset.index, 10);
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            moveItemToPosition(draggedIndex, targetIndex);
          }
        }
      }
      draggedIndex = null;
    });

    container.appendChild(div);
  });
}

function resetSingleColor(i) {
    delete links[i].color;
    renderInputs(searchInput.value);
}

function resetAllColors() {
    if(confirm("Вы уверены, что хотите сбросить цвета ВСЕХ кнопок? Они станут зависимы от общей темы.")) {
        links.forEach(link => { delete link.color; });
        renderInputs(searchInput.value);
    }
}

async function saveAll() {
  const token = ghTokenInput.value.trim();
  localStorage.setItem("myLinks", JSON.stringify(links));
  if(token) localStorage.setItem("gh_token", token);

  if (token) {
    const btn = document.querySelector('.saveBtn');
    btn.textContent = "⌛ Сохранение...";
    try {
      const resInfo = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      const fileData = await resInfo.json();
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(links, null, 2))));
      
      const saveRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Update via Editor", content: content, sha: fileData.sha })
      });
      if (saveRes.ok) alert("Успешно сохранено на GitHub! 🚀");
    } catch (e) { alert("Ошибка GitHub: " + e.message); }
    btn.textContent = "💾 Сохранить везде";
  } else {
    alert("Сохранено локально! (Для сохранения в облако укажите GITHUB TOKEN)");
  }
}

function addNewLink(){ links.unshift({name:"", url:""}); renderInputs(searchInput.value); }
function deleteLink(i){ if(confirm("Удалить?")){ links.splice(i,1); renderInputs(searchInput.value); } }
function moveUp(i){ if(i>0){ [links[i],links[i-1]]=[links[i-1],links[i]]; renderInputs(searchInput.value); } }
function moveDown(i){ if(i<links.length-1){ [links[i],links[i+1]]=[links[i+1],links[i]]; renderInputs(searchInput.value); } }

async function loadFromCloud() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}?t=${Date.now()}`);
    links = await res.json();
    localStorage.setItem("myLinks", JSON.stringify(links));
    renderInputs(searchInput.value);
    alert("Загружено из облака! ☁️");
  } catch (e) { alert("Ошибка загрузки."); }
}

const colorSelect = document.getElementById("colorSelect");
const styleSelect = document.getElementById("styleSelect");
const colsSelect = document.getElementById("colsSelect");

function applyTheme() {
  document.documentElement.style.setProperty('--accent', colorSelect.value);
  document.documentElement.style.setProperty('--cols', colsSelect.value);
  document.body.className = styleSelect.value;
  localStorage.setItem("themeColor", colorSelect.value);
  localStorage.setItem("themeStyle", styleSelect.value);
  localStorage.setItem("themeCols", colsSelect.value);
}

colorSelect.value = localStorage.getItem("themeColor") || "#a855f7";
styleSelect.value = localStorage.getItem("themeStyle") || "soft";
colsSelect.value = localStorage.getItem("themeCols") || "3";

colorSelect.onchange = applyTheme;
styleSelect.onchange = applyTheme;
colsSelect.onchange = applyTheme;
applyTheme();

links = JSON.parse(localStorage.getItem("myLinks")) || [];
renderInputs();

searchInput.addEventListener("input", () => {
  triggerSearch();
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  clearBtn.style.display = "none";
  renderInputs("");
});
</script>
