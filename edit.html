<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактировать сериалы</title>
<style>
:root { 
  --accent: #ffb400; 
  --bg: #121212; 
  --card: #1e1e1e; 
  --cols: 4;
  --font-scale: 1;
}
body { 
  font-family: "Segoe UI", sans-serif; 
  background: var(--bg); 
  color: #fff; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: calc(15px * var(--font-scale)); 
  padding: calc(40px * var(--font-scale)) calc(20px * var(--font-scale)); 
  font-size: calc(1rem * var(--font-scale));
  box-sizing: border-box;
  margin: 0;
  min-height: 100vh;
}
.themeBox { position: fixed; top: 15px; right: 15px; display: flex; gap: 5px; z-index: 100; }
select { background: #1e1e1e; color: white; border: 1px solid var(--accent); padding: calc(5px * var(--font-scale)); border-radius: 4px; font-size: calc(1rem * var(--font-scale)); }
.token-box { background: var(--card); border: 1px dashed var(--accent); padding: calc(15px * var(--font-scale)); border-radius: 10px; width: 100%; max-width: 400px; text-align: center; }
.token-box label { font-size: calc(11px * var(--font-scale)); color: var(--accent); display: block; margin-bottom: 5px; }

.searchBox { position: relative; width: 100%; max-width: 500px; }
#search { padding: calc(10px * var(--font-scale)) calc(35px * var(--font-scale)) calc(10px * var(--font-scale)) calc(10px * var(--font-scale)); width: 100%; border-radius: 8px; border: 1px solid var(--accent); background: #1e1e1e; color: white; outline: none; margin: 0; box-sizing: border-box; font-size: calc(1rem * var(--font-scale)); }
#clearSearch { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; font-size: calc(14px * var(--font-scale)); display: none; transition: 0.2s; }
#clearSearch:hover { color: #ff4444; }

/* Растягиваем контейнер редактора карточек на всю ширину экрана */
#linksContainer { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: calc(15px * var(--font-scale)); width: 100%; box-sizing: border-box; }
input { width: 100%; padding: calc(10px * var(--font-scale)); margin-bottom: 8px; border: 2px solid var(--accent); border-radius: 6px; background-color: #1e1e1e; color: #fff; box-sizing: border-box; font-size: calc(1rem * var(--font-scale)); }

.color-row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; background: rgba(0,0,0,0.2); padding: calc(5px * var(--font-scale)); border-radius: 5px; }
.ln-color { width: calc(50px * var(--font-scale)) !important; height: calc(35px * var(--font-scale)); padding: 0 !important; cursor: pointer; border: none !important; background: none !important; }
.reset-color { font-size: calc(10px * var(--font-scale)); padding: calc(5px * var(--font-scale)); cursor: pointer; background: #333; border: 1px solid #555; color: #ccc; border-radius: 4px; }

.button { background-color: var(--card); border: 2px solid var(--accent); color: var(--accent); padding: calc(10px * var(--font-scale)); border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; text-align: center; font-size: calc(1rem * var(--font-scale)); }
.button:hover { background: var(--accent); color: black; }
.linkBlock { padding: calc(15px * var(--font-scale)); border: 2px solid var(--block-accent, var(--accent)); border-radius: 10px; background: rgba(30,30,30,0.8); transition: border-color 0.2s; }
.controls { display: flex; gap: 5px; margin-top: 5px; }

.danger-btn { border-color: #ef4444; color: #ef4444; }
.danger-btn:hover { background: #ef4444; color: white; }

/* Кнопки зума */
.zoomControls {
  position: fixed;
  bottom: 15px;
  right: 15px;
  display: flex;
  gap: 5px;
  z-index: 1000;
}
.zoom-btn {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}
.zoom-btn:hover {
  background: var(--accent);
  color: #000;
}
</style>
</head>

<body>
<div class="themeBox">
  <select id="colorSelect">
    <option value="#ffb400">🟠</option>
    <option value="#a855f7">🟣</option>
    <option value="#22c55e">🟢</option>
    <option value="#3b82f6">🔵</option>
    <option value="#ef4444">🔴</option>
    <option value="#ec4899">🌸</option>
  </select>
  <select id="styleSelect"><option value="">Default</option><option value="glass">Glass</option></select>
  <select id="colsSelect">
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>
</div>

<a class="button" href="serials.html">← На главную</a>
<h1>Редактор</h1>

<div class="token-box">
    <label>GITHUB TOKEN</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxx">
</div>

<div class="searchBox">
  <input type="text" id="search" placeholder="🔍 Поиск по названию...">
  <span id="clearSearch">✖</span>
</div>

<div style="display:flex; gap:8px; flex-wrap:wrap; justify-content: center; margin-top: 5px;">
  <button class="button saveBtn" onclick="saveAll()">💾 Сохранить везде</button>
  <button class="button" onclick="addNewLink()">➕ Добавить</button>
  <button class="button danger-btn" onclick="resetAllColors()">🔴 Сбросить ВСЕ цвета</button>
  <button class="button" onclick="loadFromCloud()">🔄 Обновить из облака</button>
</div>

<div id="linksContainer"></div>

<!-- Кнопки изменения размера интерфейса -->
<div class="zoomControls">
  <button class="zoom-btn" onclick="changeZoom(-0.1)" title="Уменьшить интерфейс">А-</button>
  <button class="zoom-btn" onclick="changeZoom(0.1)" title="Увеличить интерфейс">А+</button>
</div>

<script>
const OWNER = "bucketasmr", REPO = "my-serials-data", FILE_PATH = "my-serials.json";
let links = [];
const ghTokenInput = document.getElementById("gh-token");
ghTokenInput.value = localStorage.getItem("gh_token") || "";

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearSearch');

let fontScale = parseFloat(localStorage.getItem('fontScale')) || 1;

function applyZoom() {
  if (fontScale < 0.7) fontScale = 0.7;
  if (fontScale > 1.8) fontScale = 1.8;
  document.documentElement.style.setProperty('--font-scale', fontScale);
  localStorage.setItem('fontScale', fontScale);
}

function changeZoom(delta) {
  fontScale += delta;
  applyZoom();
}

applyZoom();

function renderInputs(filter = "") {
  const container = document.getElementById("linksContainer");
  container.innerHTML = "";
  
  links.forEach((link, realIndex) => {
    if (filter && !link.name.toLowerCase().includes(filter.toLowerCase())) return;

    const div = document.createElement("div");
    div.className = "linkBlock";
    
    const hasColor = link.color && link.color.startsWith('#');
    const colorVal = hasColor ? link.color : "#ffffff";

    if (hasColor) {
      div.style.setProperty('--block-accent', link.color);
    } else {
      div.style.removeProperty('--block-accent');
    }

    div.innerHTML = `
      <input value="${link.name || ''}" placeholder="Название" class="ln-name" data-index="${realIndex}">
      <input value="${link.url || ''}" placeholder="Ссылка" class="ln-url" data-index="${realIndex}">
      <div class="color-row">
        <input type="color" value="${colorVal}" class="ln-color" ${hasColor ? 'data-active="true"' : ''} data-index="${realIndex}">
        <button class="reset-color" onclick="resetSingleColor(${realIndex})">Сбросить цвет</button>
        <span style="font-size:calc(11px * var(--font-scale)); color:${hasColor ? 'var(--accent)' : '#777'}">${hasColor ? 'ИНДИВИДУАЛЬНЫЙ' : 'ПО ТЕМЕ'}</span>
      </div>
      <div class="controls">
        <button class="button" onclick="moveUp(${realIndex})">⬆</button>
        <button class="button" onclick="moveDown(${realIndex})">⬇</button>
        <button class="button" onclick="deleteLink(${realIndex})">🗑</button>
      </div>`;
    
    const nameInput = div.querySelector('.ln-name');
    const urlInput = div.querySelector('.ln-url');
    const cp = div.querySelector('.ln-color');

    nameInput.oninput = (e) => { links[realIndex].name = e.target.value; };
    urlInput.oninput = (e) => { links[realIndex].url = e.target.value; };
    
    cp.oninput = () => { 
        cp.setAttribute('data-active', 'true'); 
        links[realIndex].color = cp.value;
        div.style.setProperty('--block-accent', cp.value);
        const status = cp.nextElementSibling.nextElementSibling;
        status.textContent = "ИНДИВИДУАЛЬНЫЙ"; 
        status.style.color = "var(--accent)"; 
    };
    
    container.appendChild(div);
  });
}

function resetSingleColor(i) {
    delete links[i].color;
    renderInputs(searchInput.value);
}

function resetAllColors() {
    if(confirm("Вы уверены, что хотите сбросить цвета ВСЕХ кнопок? Они станут зависимы от общей темы.")) {
        links.forEach(link => { delete link.color; });
        renderInputs(searchInput.value);
    }
}

async function saveAll() {
  const token = ghTokenInput.value.trim();
  localStorage.setItem("myLinks", JSON.stringify(links));
  if(token) localStorage.setItem("gh_token", token);

  if (token) {
    const btn = document.querySelector('.saveBtn');
    btn.textContent = "⌛ Сохранение...";
    try {
      const resInfo = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      const fileData = await resInfo.json();
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(links, null, 2))));
      
      const saveRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Update via Editor", content: content, sha: fileData.sha })
      });
      if (saveRes.ok) alert("Успешно сохранено на GitHub! 🚀");
    } catch (e) { alert("Ошибка GitHub: " + e.message); }
    btn.textContent = "💾 Сохранить везде";
  } else {
    alert("Сохранено локально! (Для сохранения в облако укажите GITHUB TOKEN)");
  }
}

function addNewLink(){ links.unshift({name:"", url:""}); renderInputs(searchInput.value); }
function deleteLink(i){ if(confirm("Удалить?")){ links.splice(i,1); renderInputs(searchInput.value); } }
function moveUp(i){ if(i>0){ [links[i],links[i-1]]=[links[i-1],links[i]]; renderInputs(searchInput.value); } }
function moveDown(i){ if(i<links.length-1){ [links[i],links[i+1]]=[links[i+1],links[i]]; renderInputs(searchInput.value); } }

async function loadFromCloud() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}?t=${Date.now()}`);
    links = await res.json();
    localStorage.setItem("myLinks", JSON.stringify(links));
    renderInputs(searchInput.value);
    alert("Загружено из облака! ☁️");
  } catch (e) { alert("Ошибка загрузки."); }
}

const colorSelect = document.getElementById("colorSelect");
const styleSelect = document.getElementById("styleSelect");
const colsSelect = document.getElementById("colsSelect");

function applyTheme() {
  document.documentElement.style.setProperty('--accent', colorSelect.value);
  document.documentElement.style.setProperty('--cols', colsSelect.value);
  document.body.className = styleSelect.value;
  localStorage.setItem("themeColor", colorSelect.value);
  localStorage.setItem("themeStyle", styleSelect.value);
  localStorage.setItem("themeCols", colsSelect.value);
}

colorSelect.value = localStorage.getItem("themeColor") || "#ffb400";
styleSelect.value = localStorage.getItem("themeStyle") || "";
colsSelect.value = localStorage.getItem("themeCols") || "4";

colorSelect.onchange = applyTheme;
styleSelect.onchange = applyTheme;
colsSelect.onchange = applyTheme;
applyTheme();

links = JSON.parse(localStorage.getItem("myLinks")) || [];
renderInputs();

searchInput.addEventListener("input", () => {
  renderInputs(searchInput.value);
  clearBtn.style.display = searchInput.value ? "block" : "none";
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  clearBtn.style.display = "none";
  renderInputs("");
});
</script>
</body>
</html>
