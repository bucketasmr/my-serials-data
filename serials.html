<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои сериалы</title>

<style>
:root {
  --accent: #ffb400;
  --bg: #121212;
  --card: #1e1e1e;
  --cols: 4;
  --font-scale: 1;
}

body {
  font-family: "Segoe UI", sans-serif;
  background: var(--bg);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(15px * var(--font-scale));
  padding: calc(40px * var(--font-scale)) calc(20px * var(--font-scale));
  font-size: calc(1rem * var(--font-scale));
  box-sizing: border-box;
  margin: 0;
  min-height: 100vh;
}

.themeBox {
  position: fixed;
  top: 15px;
  right: 15px;
  display: flex;
  gap: 5px;
  z-index: 1001;
}

select {
  background: #1e1e1e;
  color: white;
  border: 1px solid var(--accent);
  padding: calc(5px * var(--font-scale));
  border-radius: 4px;
  font-size: calc(1rem * var(--font-scale));
}

.searchBox {
  position: relative;
  width: 100%;
  max-width: 550px;
}

#search {
  padding: calc(10px * var(--font-scale)) calc(115px * var(--font-scale)) calc(10px * var(--font-scale)) calc(10px * var(--font-scale));
  width: 100%;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: #1e1e1e;
  color: white;
  outline: none;
  font-size: calc(1rem * var(--font-scale));
  box-sizing: border-box;
}

.search-btns {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 4px;
  align-items: center;
}

.search-action-btn {
  background: #333;
  border: 1px solid var(--accent);
  color: var(--accent);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: calc(12px * var(--font-scale));
  transition: 0.2s;
}
.search-action-btn:hover {
  background: var(--accent);
  color: #000;
}

#clearSearch {
  cursor: pointer;
  color: #aaa;
  font-size: calc(14px * var(--font-scale));
  display: none;
  transition: 0.2s;
  padding: 0 4px;
}

#clearSearch:hover {
  color: #ff4444;
}

#linksContainer {
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: calc(12px * var(--font-scale));
  width: 100%;
  box-sizing: border-box;
}

h1 { color: var(--accent); font-size: calc(2rem * var(--font-scale)); margin: 0; }

.button {
  box-sizing: border-box;
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: calc(22px * var(--font-scale)) calc(15px * var(--font-scale));
  border-radius: 8px;
  transition: 0.2s;
  text-align: center;
  width: 100%;
  text-decoration: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(85px * var(--font-scale));
  font-size: calc(1.1rem * var(--font-scale));
}

.button:hover {
  background: var(--accent) !important;
  color: #000000 !important;
  transform: scale(1.03);
}

.editBtn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1000;
  width: auto;
  padding: calc(10px * var(--font-scale)) calc(15px * var(--font-scale));
  min-height: auto !important;
}

/* Кнопки изменения размера и индикатор */
.zoomControls {
  position: fixed;
  bottom: 15px;
  right: 15px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 1000;
}

.zoom-btn {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}
.zoom-btn:hover {
  background: var(--accent);
  color: #000;
}

/* Индикатор размера */
.zoom-indicator {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.zoom-indicator.visible {
  opacity: 1;
}

/* Экранная клавиатура (увеличенные клавиши и капслок) */
#virtualKeyboard {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(18, 18, 18, 0.98);
  border-top: 3px solid var(--accent);
  padding: 15px 20px;
  z-index: 2000;
  box-sizing: border-box;
  box-shadow: 0 -5px 25px rgba(0,0,0,0.7);
}
.vk-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.vk-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  width: 100%;
}
.vk-key {
  background: var(--card);
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 18px 10px;
  flex: 1;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 22px;
  user-select: none;
  text-transform: uppercase; /* Всегда капслок */
}
.vk-key:hover {
  background: var(--accent);
  color: #000;
}
.vk-wide {
  flex: 2;
  font-size: 18px;
}

/* Стили тем */
.glass .button { backdrop-filter: blur(10px); background: rgba(30,30,30,0.6); }
.neon .button { box-shadow: 0 0 calc(10px * var(--font-scale)) var(--accent); }
.soft .button { border-radius: calc(20px * var(--font-scale)); }
.minimal .button { border: none; border-bottom: 2px solid var(--accent); border-radius: 0; }
.bold .button { font-weight: bold; }

</style>
</head>

<body>

<div class="themeBox">
  <select id="colorSelect">
    <option value="#ffb400">🟠</option>
    <option value="#a855f7">🟣</option>
    <option value="#22c55e">🟢</option>
    <option value="#3b82f6">🔵</option>
    <option value="#ef4444">🔴</option>
    <option value="#ec4899">🌸</option>
  </select>

  <select id="styleSelect">
    <option value="">Default</option>
    <option value="glass">Glass</option>
    <option value="neon">Neon</option>
    <option value="soft">Soft</option>
    <option value="minimal">Minimal</option>
    <option value="bold">Bold</option>
  </select>

  <select id="colsSelect">
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>
</div>

<a class="button editBtn" href="edit.html">Редактировать</a>
<button class="button" onclick="loadFromCloud()" style="width: auto; padding: 10px 20px; margin-bottom: 5px; min-height: auto;">🔄 Обновить из облака</button>

<h1>Мои сериалы 🎬</h1>

<div class="searchBox">
  <input type="text" id="search" placeholder="🔍 Поиск по названию...">
  <div class="search-btns">
    <span id="clearSearch">✖</span>
    <button class="search-action-btn" onclick="toggleKeyboard()" title="Экранная клавиатура">⌨</button>
    <button class="search-action-btn" onclick="startVoiceSearch()" title="Голосовой ввод">🎤</button>
  </div>
</div>

<div id="linksContainer"></div>

<!-- Экранная клавиатура -->
<div id="virtualKeyboard">
  <div class="vk-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; color: var(--accent); font-weight: bold; font-size: 16px;">
      <span id="vkTitle">Экранная клавиатура (РУС)</span>
      <span onclick="toggleKeyboard()" style="cursor: pointer; padding: 4px 12px; background: rgba(255,255,255,0.1); border-radius: 6px;">✖ Закрыть</span>
    </div>
    <div class="vk-row" id="vkRow1"></div>
    <div class="vk-row" id="vkRow2"></div>
    <div class="vk-row" id="vkRow3"></div>
    <div class="vk-row">
      <div class="vk-key vk-wide" onclick="toggleLanguage()" id="langBtn" style="background: var(--accent); color: #000;">РУС / ENG</div>
      <div class="vk-key vk-wide" onclick="vkPress(' ')">ПРОБЕЛ</div>
      <div class="vk-key vk-wide" onclick="vkBackspace()">⌫ СТЕРЕТЬ</div>
      <div class="vk-key vk-wide" onclick="vkClear()">ОЧИСТИТЬ</div>
    </div>
  </div>
</div>

<!-- Кнопки изменения размера интерфейса и индикатор -->
<div class="zoomControls">
  <div id="zoomIndicator" class="zoom-indicator">100%</div>
  <button class="zoom-btn" onclick="changeZoom(-0.1)" title="Уменьшить интерфейс">А-</button>
  <button class="zoom-btn" onclick="changeZoom(0.1)" title="Увеличить интерфейс">А+</button>
</div>

<script>
const CLOUD_URL_BASE = "https://raw.githubusercontent.com/bukcetasmr/my-serials-data/refs/heads/main/my-serials.json";
const defaultLinks = [
  {name:"Неудержимые 3",url:"https://onlinevkino.com/7970-neuderzhimye-3-2014.html"}
];

let links = [];
const container = document.getElementById('linksContainer');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearSearch');
const vkBoard = document.getElementById('virtualKeyboard');
const zoomIndicator = document.getElementById('zoomIndicator');
let zoomTimeout = null;

let currentLang = 'ru';

const layouts = {
  ru: {
    title: 'Экранная клавиатура (РУС)',
    row1: ['й','ц','у','к','е','н','г','ш','щ','з','х','ъ'],
    row2: ['ф','ы','в','а','п','р','о','л','д','ж','э'],
    row3: ['я','ч','с','м','и','т','ь','б','ю']
  },
  en: {
    title: 'Virtual Keyboard (ENG)',
    row1: ['q','w','e','r','t','y','u','i','o','p'],
    row2: ['a','s','d','f','g','h','j','k','l'],
    row3: ['z','x','c','v','b','n','m']
  }
};

function renderKeyboard() {
  document.getElementById('vkTitle').textContent = layouts[currentLang].title;
  
  const r1 = document.getElementById('vkRow1');
  const r2 = document.getElementById('vkRow2');
  const r3 = document.getElementById('vkRow3');
  
  r1.innerHTML = layouts[currentLang].row1.map(char => `<div class="vk-key" onclick="vkPress('${char}')">${char}</div>`).join('');
  r2.innerHTML = layouts[currentLang].row2.map(char => `<div class="vk-key" onclick="vkPress('${char}')">${char}</div>`).join('');
  r3.innerHTML = layouts[currentLang].row3.map(char => `<div class="vk-key" onclick="vkPress('${char}')">${char}</div>`).join('');
}

function toggleLanguage() {
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  renderKeyboard();
}

renderKeyboard();

let fontScale = parseFloat(localStorage.getItem('fontScale')) || 1.4;

function updateZoomIndicator() {
  const percent = Math.round(fontScale * 100) + '%';
  zoomIndicator.textContent = percent;
  zoomIndicator.classList.add('visible');

  if (zoomTimeout) clearTimeout(zoomTimeout);
  zoomTimeout = setTimeout(() => {
    zoomIndicator.classList.remove('visible');
  }, 3000);
}

function applyZoom() {
  if (fontScale < 0.7) fontScale = 0.7;
  if (fontScale > 1.8) fontScale = 1.8;
  document.documentElement.style.setProperty('--font-scale', fontScale);
  localStorage.setItem('fontScale', fontScale);
  updateZoomIndicator();
}

function changeZoom(delta) {
  fontScale += delta;
  applyZoom();
}

applyZoom();
zoomIndicator.classList.remove('visible');

function toggleKeyboard() {
  vkBoard.style.display = vkBoard.style.display === 'block' ? 'none' : 'block';
}

function vkPress(char) {
  searchInput.value += char;
  triggerSearch();
}

function vkBackspace() {
  searchInput.value = searchInput.value.slice(0, -1);
  triggerSearch();
}

function vkClear() {
  searchInput.value = "";
  triggerSearch();
}

function triggerSearch() {
  renderLinks(searchInput.value);
  clearBtn.style.display = searchInput.value ? "block" : "none";
}

function startVoiceSearch() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Голосовой ввод не поддерживается вашим браузером.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    searchInput.value = text;
    triggerSearch();
  };
  recognition.onerror = () => {
    alert("Не удалось распознать голос. Попробуйте еще раз.");
  };
  recognition.start();
}

async function chooseDataSource() {
  const localData = localStorage.getItem('myLinks');
  if (localData) {
    links = JSON.parse(localData);
    renderLinks();
  } else {
    await loadFromCloud();
  }
}

function loadFromLocal() {
  links = JSON.parse(localStorage.getItem('myLinks')) || defaultLinks;
  renderLinks();
}

async function loadFromCloud() {
  try {
    const url = CLOUD_URL_BASE + "?t=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    links = await res.json();
    localStorage.setItem('myLinks', JSON.stringify(links));
    renderLinks();
  } catch (e) {
    loadFromLocal();
  }
}

function renderLinks(filter="") {
  container.innerHTML = "";
  links.forEach(link => {
    if (!link.name.toLowerCase().includes(filter.toLowerCase())) return;
    const a = document.createElement('a');

    if (!link.url || link.url.trim() === "" || link.url === "https://") {
      a.href = "#";
      a.onclick = (e) => { e.preventDefault(); alert("Добавь ссылку ⚠"); };
    } else {
      let url = link.url.trim();
      if (!/^[a-zA-Z]+:\/\//.test(url)) url = "https://" + url;
      a.href = url;
      a.target = "_blank";
    }

    a.textContent = link.name;
    a.className = "button";

    if (link.color && link.color.startsWith('#')) {
      a.style.setProperty('--accent', link.color);
      a.style.borderColor = link.color;
      a.style.color = link.color;
    } else {
      a.style.removeProperty('--accent');
      a.style.borderColor = "";
      a.style.color = "";
    }

    container.appendChild(a);
  });
}

const colorSelect = document.getElementById("colorSelect");
const styleSelect = document.getElementById("styleSelect");
const colsSelect = document.getElementById("colsSelect");

function applyTheme() {
  document.documentElement.style.setProperty('--accent', colorSelect.value);
  document.documentElement.style.setProperty('--cols', colsSelect.value);
  document.body.className = styleSelect.value;
  localStorage.setItem("themeColor", colorSelect.value);
  localStorage.setItem("themeStyle", styleSelect.value);
  localStorage.setItem("themeCols", colsSelect.value);
  
  renderLinks(searchInput.value);
}

colorSelect.value = localStorage.getItem("themeColor") || "#a855f7";
styleSelect.value = localStorage.getItem("themeStyle") || "soft";
colsSelect.value = localStorage.getItem("themeCols") || "3";

chooseDataSource();
applyTheme();

colorSelect.onchange = applyTheme;
styleSelect.onchange = applyTheme;
colsSelect.onchange = applyTheme;

searchInput.addEventListener("input", () => {
  triggerSearch();
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  clearBtn.style.display = "none";
  renderLinks("");
});
</script>

</body>
</html>
